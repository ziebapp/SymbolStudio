<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GROUP 24 — motion prototype</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.4 Inter, system-ui, sans-serif; }
  #stage { width: 100vw; max-width: 1600px; margin: 0 auto; aspect-ratio: 16/9; }
  #stage svg { width: 100%; height: 100%; display: block; }
  .bar { display: flex; gap: 12px; align-items: center; padding: 12px 16px; max-width: 1600px; margin: 0 auto; flex-wrap: wrap; }
  input[type=range] { flex: 1; min-width: 200px; }
  button, select { background: #222; color: #ddd; border: 1px solid #444; padding: 6px 10px; border-radius: 4px; }
  #tc { font-family: ui-monospace, monospace; min-width: 90px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <select id="scene"></select>
  <button id="play">❚❚</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="tc">0.00 s</span>
</div>
<script src="vendor/flubber.min.js"></script><script src="logos.js"></script>
<script src="engine.js"></script>
<script>
  const sel = document.getElementById('scene'), stage = document.getElementById('stage');
  const scrub = document.getElementById('scrub'), tc = document.getElementById('tc'), btn = document.getElementById('play');
  Object.keys(G24.SCENES).forEach(k => sel.add(new Option(k, k)));
  let t = 0, playing = true, last = performance.now();
  const dur = () => G24.SCENES[sel.value].dur;
  function draw() { stage.innerHTML = G24.frame(sel.value, t); scrub.value = t / dur() * 1000; tc.textContent = t.toFixed(2) + ' s'; }
  function tick(now) { if (playing) { t += (now - last) / 1000; if (t > dur() + 0.6) t = 0; } last = now; draw(); requestAnimationFrame(tick); }
  btn.onclick = () => { playing = !playing; btn.textContent = playing ? '❚❚' : '▶'; };
  scrub.oninput = () => { playing = false; btn.textContent = '▶'; t = scrub.value / 1000 * dur(); };
  sel.onchange = () => { t = 0; };
  requestAnimationFrame(tick);
</script>
</body>
</html>
